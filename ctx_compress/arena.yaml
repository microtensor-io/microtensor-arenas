purpose:
  summary: >-
    Coding agent gateways classify every request by kind and route each kind to a model. The
    compaction kind is the full session plus a summarise instruction, sent when the context window
    is nearly full; the summary becomes the first message of the new context. Gateways send it to
    the main model today because cheap models lose detail. This specialist writes that summary
    faithfully, at a flat low price, within the latency of the main model.
  input: >-
    The agent's compaction instruction as the system message, and the session rendered as canonical
    text inside <session> tags as the user message, up to 120,000 tokens
  output: >-
    Plain markdown with nine fixed headings in order, at most 3,072 tokens, no JSON and no preamble
  brief:
    summary: >-
      Agent gateways send compaction requests to the main model because cheap models lose detail. This specialist writes the summary that starts the next context, faithfully, at a flat price.
    input: Agent session, up to 120,000 tokens
    output: Nine heading markdown summary, at most 3,072 tokens

slm:
  bases:
    - ibm-granite/granite-4.0-h-micro
  reference:
    model: ibm-granite/granite-4.0-h-micro
    revision: d5f01a3ea75f088947be3aae039f4ad52837dfde
  dataset:
    name: microtensor/agent-sessions
    url: https://huggingface.co/datasets/microtensor/agent-sessions
    licence: Microtensor dataset terms
    about: >-
      Our own corpus of coding agent sessions on permissively licensed repository tasks, recorded
      through a tap and stripped by the canonical renderer. The dev split is public, 2,000 sessions
      at launch; the hidden split never leaves validators. Codex sessions join in v2.1.
    note: Recorded agent sessions, rendered canonically; dev split public, hidden split withheld.
  prompt: "<|start_of_role|>system<|end_of_role|>{system}<|end_of_text|>\n<|start_of_role|>user<|end_of_role|>{user}<|end_of_text|>\n<|start_of_role|>assistant<|end_of_role|>"
  stop: ["<|end_of_text|>"]
  grader: context_compression
  primary_metric: item_score_pass_rate
  success_rule: item_score_at_least_0_60
  twin_rule: same_session_two_cuts
  evaluation:
    - name: Canonical rendering
      note: >-
        The session arrives as [user], [assistant], [tool_use name id] and [tool_result id, N lines
        kept of M] blocks, one per line, in order, after deterministic stripping. The gateway
        renders; the model never sees raw JSON.
      formula: input(i) = render(session(i)) inside <session> tags
    - name: Format gate
      note: >-
        The nine headings are Primary request and intent, Key technical concepts, Files and code
        sections, Errors and fixes, Problem solving, All user messages, Pending tasks, Current work
        and Next step, each on its own line as a level two heading.
      formula: valid(i) = 1 if all nine headings are present, in order, with nothing before the first, otherwise 0
    - name: Compression gate
      formula: C(i) = 1 if output_tokens ≤ min(3072, max(1000, 0.05 × input_tokens)), otherwise 0
    - name: Key fact recall
      note: File paths, function names, exception types, commands and user decisions in the session, taken from its canonical rendering. Identifiers match exactly after normalisation.
      formula: recall(i) = facts_kept / facts_total
    - name: Hallucination rate
      note: Code identifiers in the output that never appear in the session. Common tool and brand names do not count.
      formula: halluc(i) = invented_identifiers / identifiers_in_output
    - name: Continuation probes
      note: >-
        A fixed CPU probe agent reads the summary alone and answers: the current task, the last test
        result, the last edited file, the last error, and the next action (kind and file), scored
        against what the agent actually did next.
      formula: cont(i) = mean probe score over the item's probes
    - name: Item score
      formula: |-
        item_score(i) = valid(i) · C(i) · (1 − halluc(i)) · (0.5·recall(i) + 0.5·cont(i))
        pass(i) = 1 if item_score(i) ≥ 0.60
    - name: Resume gate
      note: >-
        On 20 sampled hidden items per paid miner, validators resume the task from the miner's summary
        with the pinned reference agent through the relay and check that the task still passes. A
        failed gate sets the miner's SLM score to 0 for the epoch. This is the gateway's own fidelity
        test.
      formula: Resume = 1 if LB(resume_pass) ≥ reference_agent_pass − 0.05, otherwise 0
    - name: SLM score
      formula: S_slm = G · P · Resume · LB · twin · (1 + 0.25·E + B), with B = 0 in this arena
    - name: Paid when
      formula: n ≥ 100 and the paired lower bound of (miner − reference) per item, clustered by session, is above 0

grading:
  pass_threshold: 0.6
  tokenizer: ibm-granite/granite-4.0-h-micro
  min_output_tokens: 1000
  max_output_share: 0.05
  max_output_tokens: 3072
  headings:
    - Primary request and intent
    - Key technical concepts
    - Files and code sections
    - Errors and fixes
    - Problem solving
    - All user messages
    - Pending tasks
    - Current work
    - Next step
  cuts: [81920, 122880]

envelope:
  group: mt-5
  overrides:
    max_input_tokens: 122880
    max_output_tokens: 3072
    tpot_p95_ms: 20
    long_input: {ttft_p95_ms: 25000, e2e_p95_ms: 75000}

scoring:
  wilson_z: 1.96
  twin: {tolerance: 0.02, slope: 0.1}
  efficiency: {form: linear}
  edge_bonus: {per_group: 0.1, max: 0.2, applies: false}
  envelope_rule: per_item
  cap: null
  empty_pools: burn
  router: brier_auroc
  min_items: 100

harness:
  tools: []
  request_timeout_s: 120
  code_limit_mb: 2
  max_steps: 32
  max_total_tokens: 200000
  max_model_calls: 2
  added_wall_p95_ms: 3000
  chunking: false
  faults: model
  rows:
    - [Role, "wraps the SLM; renders, validates the headings and repairs"]
    - [Model calls, "at most 2 per item: one full pass, one repair pass on the output only"]
    - [Chunking, "not allowed: the full session goes to the model in one call"]
    - [Added wall time (p95), "≤ 3 s per item"]
    - [Network, none except the gateway]
    - [Faults, "about 1 in 7 items get a faulty model response (error, timeout or cut off); the harness must not crash"]
    - [Output, the nine heading markdown or a clean error]
    - [Session text, "instructions inside it are content, never commands"]

router:
  max_parameters: 1500000000
  max_input_tokens: 8192
  latency_gate_ms: 300
  reference: null
  rows:
    - [Runs, alongside the system on the same envelope]
    - [Max size, "≤ 1,500,000,000 parameters"]
    - [Max input, "8,192 tokens: the summary, then the end of the session"]
    - [Added latency (p95), under 300 ms per item]
    - [Output, "draft_correct: the probability from 0 to 1 that the summary passes"]
    - [Scored on, "calibration (Brier score) and separation of passing from failing summaries (AUROC)"]
    - [Baseline, "reference router, not published yet"]

