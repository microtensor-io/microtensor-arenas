      provider: openrouter
      version: anthropic/claude-haiku-5.5
      usd_in_per_mtok: 0.1
      usd_out_per_mtok: 0.5
    - model: glm-5-3-flash
      provider: openrouter
      version: z-ai/glm-5.3-flash
      usd_in_per_mtok: 0.048
      usd_out_per_mtok: 0.2
  rows:
    - [Trigger, draft_correct below the customer's quality floor]
    - [Frontier access, "the relay only; both models read 120,000 token sessions; frontier models served by inference miners on our network replace these once listed, never outside providers"]
    - [Spend cap, "1.5 × the cost of a full frontier redo per item"]
    - [Output, the same nine heading markdown]
    - [Scored on, the item score after repair and the cost of the repair]

